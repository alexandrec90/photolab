# The local stack.
#
# EVERY published port is a `${*_HOST_PORT:-<conventional default>}` variable, never
# a literal. That is what lets a parallel `git worktree` bring up a second stack
# without editing this file: it sets the offsets in its own `.env`. A hardcoded port
# here is the bug that makes two checkouts un-runnable at the same time — the
# defaults exist so a bare clone with no `.env` still works.
#
# Containers, network, and volumes are namespaced by COMPOSE_PROJECT_NAME (set in
# `.env`, and it must equal the checkout's directory name).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photolab_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-photolab}
    ports:
      - "${DB_HOST_PORT:-5439}:5432"
    volumes:
      # The parent, not `.../data`: from 18 the image keeps its cluster in a versioned
      # directory below this one, and refuses to start with a volume on the old path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Other services wait on this, so `up -d` returning means the DB is actually
      # accepting connections — not merely that the container started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photolab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6386}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # Behind a profile, because the album normally runs on the host (`scripts/album.py`), on
  # these same ports, and a plain `up` from devkit's "Docker: Start Stack" must not take them.
  # `docker compose --profile full up -d` runs it all here, with no AI images.
  app:
    profiles: ["full"]
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file: .env
    # Migrations first, so a pull that changes the schema needs no extra step.
    command: ["sh", "-c", "alembic upgrade head && python -m photolab serve --host 0.0.0.0"]
    environment:
      # `.env` holds the host's view of the stack; inside it, the services have names.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photolab}:${POSTGRES_PASSWORD:-photolab_local_dev}@db:5432/${POSTGRES_DB:-photolab}
      REDIS_URL: redis://redis:6379/0
      PHOTO_LIBRARY_DIR: /photos
      PHOTOLAB_DATA_DIR: /data
      REMBG_HOME: /models
    ports:
      # Loopback only. This API serves private photos and has no login, so publishing it
      # on every interface would hand the album to anyone on the same network.
      - "127.0.0.1:${APP_HOST_PORT:-8007}:8000"
    volumes:
      # Bind-mounted for live reload. The venv stays in an anonymous volume so the
      # host's (Windows) .venv never shadows the container's (Linux) one.
      - .:/app
      - /app/.venv
      # Read-only, so nothing here can ever alter an original.
      - ${PHOTO_LIBRARY_HOST_DIR:-./photos}:/photos:ro
      - ${PHOTOLAB_DATA_HOST_DIR:-./data}:/data
      # A volume, so the model's 1 GB survives a rebuild and is shared by no one's checkout.
      - models:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Matting is the peak. See "Matting" in README.md for what each model needs.
    mem_limit: ${APP_MEM_LIMIT:-3g}

  frontend:
    profiles: ["full"]
    image: node:22-alpine
    working_dir: /app
    # The bare `node_modules` volume starts empty, and a `dev` with nothing installed dies.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5180}:5173"
    environment:
      # Vite HMR does not see writes through a Windows bind mount without polling.
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    mem_limit: 1g

volumes:
  pgdata:
  node_modules:
  models:
